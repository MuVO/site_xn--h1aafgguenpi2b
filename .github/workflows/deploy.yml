name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prepare custom domain
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: |
          if [[ -z "$SITE_DOMAIN" ]]; then
            echo "Set the SITE_DOMAIN Actions variable before deploying." >&2
            exit 1
          fi
          printf '%s\n' "$SITE_DOMAIN" > public/CNAME
      - name: Build static site
        env:
          PUBLIC_ORG_NAME: ${{ vars.PUBLIC_ORG_NAME }}
          PUBLIC_INN: ${{ vars.PUBLIC_INN }}
          PUBLIC_OGRNIP: ${{ vars.PUBLIC_OGRNIP }}
          PUBLIC_CERTIFICATE_SERIES: ${{ vars.PUBLIC_CERTIFICATE_SERIES }}
          PUBLIC_CERTIFICATE_NUMBER: ${{ vars.PUBLIC_CERTIFICATE_NUMBER }}
          PUBLIC_REGISTRATION_DATE: ${{ vars.PUBLIC_REGISTRATION_DATE }}
          PUBLIC_LEGAL_ADDRESS: ${{ vars.PUBLIC_LEGAL_ADDRESS }}
          PUBLIC_POSTAL_ADDRESS: ${{ vars.PUBLIC_POSTAL_ADDRESS }}
          PUBLIC_PHONE: ${{ vars.PUBLIC_PHONE }}
          PUBLIC_EMAIL: ${{ vars.PUBLIC_EMAIL }}
          PUBLIC_TELEGRAM: ${{ vars.PUBLIC_TELEGRAM }}
          PUBLIC_CONTACT_FUNCTION_URL: ${{ vars.PUBLIC_CONTACT_FUNCTION_URL }}
          PUBLIC_SITE_URL: https://${{ vars.SITE_DOMAIN }}
          PUBLIC_BANK_NAME: ${{ vars.PUBLIC_BANK_NAME }}
          PUBLIC_CURRENCY: ${{ vars.PUBLIC_CURRENCY }}
          PUBLIC_BANK_INN: ${{ vars.PUBLIC_BANK_INN }}
          PUBLIC_BANK_BIK: ${{ vars.PUBLIC_BANK_BIK }}
          PUBLIC_ACCOUNT: ${{ vars.PUBLIC_ACCOUNT }}
          PUBLIC_CORR_ACCOUNT: ${{ vars.PUBLIC_CORR_ACCOUNT }}
          PUBLIC_BANK_ADDRESS: ${{ vars.PUBLIC_BANK_ADDRESS }}
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
